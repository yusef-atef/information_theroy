<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCorrect Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0E1A;
            --card-bg: rgba(30, 41, 59, 0.4);
            --accent: #6366F1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-main: #F1F5F9;
            --text-dim: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-circle {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 20px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
        }

        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 20px 24px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .user-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .user-email {
            color: var(--text-dim);
            font-size: 14px;
        }

        .file-count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .timestamp {
            color: var(--text-dim);
            font-size: 14px;
        }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="/static/securecorrect_logo_1776960663014.png" width="44" height="44" style="border-radius: 50%; box-shadow: 0 0 20px var(--accent-glow);">
                <h1>SecureCorrect <span style="color: var(--text-dim); font-weight: 400; margin-left: 8px;">Admin Panel</span></h1>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                Live Monitoring
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-value" id="total-users">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Files</div>
                <div class="stat-value" id="total-files">0</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Files</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Dynamic content -->
                </tbody>
            </table>
            <div id="loading" class="empty-state">
                Connecting to live stream...
            </div>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('user-table-body');
        const totalUsersEl = document.getElementById('total-users');
        const totalFilesEl = document.getElementById('total-files');
        const loadingEl = document.getElementById('loading');

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/admin/ws`);

            ws.onopen = () => {
                console.log('Connected to admin stream');
                loadingEl.style.display = 'none';
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'USER_UPDATE') {
                    updateTable(message.data);
                }
            };

            ws.onclose = () => {
                console.log('Stream closed. Reconnecting...');
                loadingEl.style.display = 'block';
                setTimeout(connect, 3000);
            };
        }

        function updateTable(users) {
            tableBody.innerHTML = '';
            
            if (users.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="empty-state">No users registered yet.</td></tr>';
                totalUsersEl.innerText = '0';
                totalFilesEl.innerText = '0';
                return;
            }

            let totalFiles = 0;
            users.forEach(user => {
                totalFiles += user.file_count;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="user-name">${user.username}</div>
                        <div style="font-size: 11px; color: var(--text-dim)">ID: ${user.id.substring(0, 8)}...</div>
                    </td>
                    <td><span class="user-email">${user.email}</span></td>
                    <td>
                        <div class="file-count">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                            ${user.file_count}
                        </div>
                    </td>
                    <td><span class="timestamp">${new Date(user.created_at).toLocaleDateString()}</span></td>
                `;
                tableBody.appendChild(row);
            });

            totalUsersEl.innerText = users.length;
            totalFilesEl.innerText = totalFiles;
        }

        connect();
    </script>
</body>
</html>
