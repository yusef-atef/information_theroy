name: securecorrect
description: "Fault-Tolerant Cloud Storage with Error-Correcting Authentication"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  dio: ^5.4.3
  flutter_secure_storage: any
  file_picker: ^8.0.7
  open_filex: ^4.4.0
  lottie: ^3.1.2
  path_provider: ^2.1.3
  mime: ^1.0.5
  intl: ^0.19.0
  equatable: ^2.0.5
  local_auth: ^2.1.6
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  convert: ^3.1.1
  pointycastle: ^3.9.1
  google_fonts: ^6.2.1
  syncfusion_flutter_pdfviewer: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
